{% extends "base.html" %}
{% block title %}Arena Console | CampusCode{% endblock %}
{% block css %}<link rel="stylesheet" href="/css/dashboard.css">{% endblock %}

{% block content %}
<div class="dx">
  <aside class="dx-rail">
    <a href="/" class="dx-brand">
      <img src="/img/campuscode-logo.png" alt="CampusCode">
      <span>CAMPUSCODE<small>Arena console</small></span>
    </a>

    <button class="dx-mini" id="miniId" type="button" data-go="digital-card">
      <span class="dx-av" id="miniAv">ST</span>
      <span class="dx-mini-text"><b id="miniName">Student</b><small id="miniId2">CC-2026-0000</small></span>
    </button>

    <nav class="dx-nav" id="nav" aria-label="Student sections"></nav>

    <button class="dx-logout" id="logout" type="button"><i data-lucide="log-out"></i> Log out</button>
  </aside>

  <div class="dx-main">
    <header class="dx-top">
      <p class="label" id="crumb">CampusCode / Student / Overview</p>
      <div class="dx-top-r">
        <button class="dx-bell" id="bell" type="button" data-go="notifications" aria-label="Notifications">
          <i data-lucide="bell"></i><b id="bellCount">0</b>
        </button>
        <span class="dx-user"><span class="dx-av" id="topAv">ST</span><span id="topName">Student</span></span>
      </div>
    </header>
    <main class="dx-view" id="view"></main>
  </div>
</div>
<div class="dx-toast" id="toast" role="status"></div>
{% endblock %}

{% block js %}
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="/js/dashboard.js"></script>
{% endblock %}
